syntax = "proto3";
package datamodels;

import "google/protobuf/timestamp.proto";
import "health_event.proto";
// Imported for the shared Condition message. protoc-gen-crd also emits CRDs for
// transitive imports, so the Makefile rule deletes the strays.
import "external_remediation.proto";
import "github.com/yandex/protoc-gen-crd/library/go/k8s/protoc_gen_crd/proto/crd.proto";

option go_package = "github.com/nvidia/nvsentinel/data-models/pkg/protos";

message MaintenanceRequestSpec {
  // healthEvent describes the preparation NVSentinel must perform. The reconciler
  // emits it as authored, so the recommendedAction it names selects the remediation.
  HealthEvent healthEvent = 1;

  // startTime is when the maintenance window opens. Must be in the future on
  // create, and on update whenever it changes.
  google.protobuf.Timestamp startTime = 2;
}

message MaintenanceRequestStatus {
  // conditions are the latest observations of the request's state. There is no
  // completionTime: an MR is deleted to clear its fault, not retained.
  repeated Condition conditions = 1;
}

// MaintenanceRequest signals that maintenance is incoming for a node, so
// NVSentinel prepares it (cordon, drain) beforehand. It persists until the
// requester deletes it, and deleting it clears the fault. See ADR-051.
message MaintenanceRequest {
  option (protoc_gen_crd.k8s_crd) = {
    api_group: "nvsentinel.dgxc.nvidia.com",
    kind: "MaintenanceRequest",
    plural: "maintenancerequests",
    singular: "maintenancerequest",
    short_names: ["mr"],
    categories: ["nvsentinel"],
    // Cluster-scoped, like the other node-level CRDs.
    scope: ST_CLUSTER,
    additional_columns: [
      {name: "Node",      type: CT_STRING, json_path: ".spec.healthEvent.nodeName"},
      {name: "StartTime", type: CT_STRING, format: CF_DATE, json_path: ".spec.startTime"}
    ]
  };
  MaintenanceRequestSpec spec = 1;
  MaintenanceRequestStatus status = 2;
}
